# Production Configuration

# Server Configuration
server.port=${PORT:8080}

# JPA/Hibernate Configuration for Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.lostio=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Security: Require environment variables for production
jwt.secret=${JWT_SECRET}

# Database: Require environment variables for production
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Cloudinary: Require environment variables for production
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
