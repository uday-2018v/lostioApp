# Development Profile Configuration

# MongoDB Configuration for Development
spring.data.mongodb.uri=mongodb://localhost:27017/lostioapp_dev
spring.data.mongodb.database=lostioapp_dev

# JWT Configuration for Development
jwt.secret=dev-secret-key-for-testing-purposes-only
jwt.expiration=86400000

# Logging for Development
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.mongodb.core=DEBUG
logging.level.com.lostio=TRACE

# Show SQL Queries
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Development CORS - Allow all origins
cors.allowed-origins=*
