# Server Configuration
server.port=8080
spring.application.name=lostio-backend

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/lostioapp
spring.data.mongodb.database=lostioapp

# Alternative configuration for MongoDB Atlas (cloud)
# spring.data.mongodb.uri=mongodb+srv://username:password@cluster.mongodb.net/lostioapp

# JWT Configuration
jwt.secret=lostioapp-secret-key-change-this-in-production-environment-minimum-256-bits
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary Configuration (optional, can be configured via environment variables)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Logging
logging.level.org.springframework.data.mongodb.core=DEBUG
logging.level.com.lostio=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS Configuration
cors.allowed-origins=http://localhost:19000,http://localhost:19001,http://localhost:19002,http://localhost:8081

# Spring Data MongoDB
spring.data.mongodb.auto-index-creation=true
