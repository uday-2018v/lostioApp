# Server Configuration
server.port=8080

# MongoDB Configuration (Local)
spring.data.mongodb.uri=mongodb://localhost:27017/lostioapp
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
# IMPORTANT: Change this secret in production! Use a strong, randomly generated key.
# Store in environment variables or secure configuration service.
jwt.secret=mySecretKey123456789abcdefghijklmnopqrstuvwxyz
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging
logging.level.com.lostio=INFO
logging.level.org.springframework.security=DEBUG
